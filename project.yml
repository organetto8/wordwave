name: Wordwave
options:
  bundleIdPrefix: com.ssquillante
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  Wordwave:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    scheme:
      testTargets:
        - WordwaveTests
    sources:
      - Wordwave
    info:
      path: Wordwave/Info.plist
      properties:
        CFBundleDisplayName: Wordwave
        CFBundleShortVersionString: "0.2.0-beta.1"
        CFBundleVersion: "3"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        # Public half of the update signing key: written by `swift scripts/update-signing.swift generate`.
        WordwaveUpdatePublicKey: "e7KSJDitB7wVk5mCtLf4ecidwMw1bzDk8Df4ASWyBgU="
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ssquillante.Wordwave
        PRODUCT_NAME: Wordwave
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  # The updater, the issue links and the muted/archived chat lookup, compiled on their own: no host app, so tests
  # never touch WhatsApp's data (the chat lookup runs on made-up databases).
  WordwaveTests:
    type: bundle.unit-test
    platform: macOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - Tests/WordwaveTests
      - Wordwave/Updates/UpdateCheck.swift
      - Wordwave/Updates/UpdateInstaller.swift
      - Wordwave/Reports/IssueReport.swift
      - Wordwave/Services/ChatStateColumns.swift
      - Wordwave/Services/SQLiteConnection.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ssquillante.WordwaveTests
