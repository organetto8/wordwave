<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="background" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#6D5AE6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="280" y1="0" x2="744" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0FB5A6"/>
      <stop offset="0.5" stop-color="#2F6FE8"/>
      <stop offset="1" stop-color="#5B4BD8"/>
    </linearGradient>
  </defs>

  <!-- macOS icon grid: 824pt body inside a 1024pt canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#background)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#gloss)"/>

  <!-- Speech bubble, with a soft shadow drawn as an offset copy -->
  <g fill="#0B2A6B" fill-opacity="0.18" transform="translate(0 18)">
    <rect x="180" y="250" width="664" height="430" rx="132"/>
    <path d="M292 650 L262 776 L436 668 Z"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="180" y="250" width="664" height="430" rx="132"/>
    <path d="M292 650 L262 776 L436 668 Z" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>
  </g>

  <!-- Waveform that settles into lines of text -->
  <g fill="url(#ink)">
    <rect x="282" y="390" width="38" height="150" rx="19"/>
    <rect x="342" y="340" width="38" height="250" rx="19"/>
    <rect x="402" y="375" width="38" height="180" rx="19"/>
    <rect x="462" y="415" width="38" height="100" rx="19"/>
    <rect x="522" y="440" width="38" height="50" rx="19"/>
    <rect x="590" y="376" width="154" height="38" rx="19"/>
    <rect x="590" y="446" width="154" height="38" rx="19"/>
    <rect x="590" y="516" width="100" height="38" rx="19"/>
  </g>
</svg>
