name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: XcodeGen
        run: brew install xcodegen
      - name: Test
        run: |
          xcodegen generate
          xcodebuild test -project Wordwave.xcodeproj -scheme Wordwave -destination 'platform=macOS' -derivedDataPath build
